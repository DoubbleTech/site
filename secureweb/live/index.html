<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Secure Web | Live Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .view-hidden { display: none !important; }
    </style>

<body>
    <div id="login-view" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-md border border-emerald-500/20">
            <h2 class="text-2xl font-bold text-emerald-400 mb-6 text-center">ADMIN AUTHENTICATION</h2>
            <input type="text" id="username" placeholder="Username" class="w-full mb-4 p-3 bg-slate-900 rounded-xl border border-slate-700 outline-none">
            <input type="password" id="password" placeholder="Access Token" class="w-full mb-6 p-3 bg-slate-900 rounded-xl border border-slate-700 outline-none">
            <button onclick="handleLogin()" class="w-full bg-emerald-500 text-slate-900 font-bold py-3 rounded-xl hover:bg-emerald-400">LOGIN TO CLOUD</button>
        </div>
    </div>

    <div id="dashboard-view" class="view-hidden p-8">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-emerald-400">SECURE WEB CONTROL</h1>
                <button onclick="location.reload()" class="text-rose-400 font-bold text-xs">LOGOUT</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-slate-800 p-6 rounded-2xl">Active Users: <span id="stat-users" class="font-bold">0</span></div>
                <div class="bg-slate-800 p-6 rounded-2xl">Pending: <span id="stat-pending" class="font-bold">0</span></div>
                <div class="bg-slate-800 p-6 rounded-2xl">Revenue: <span id="stat-revenue" class="font-bold">0</span> PKR</div>
                <div class="bg-slate-800 p-6 rounded-2xl">Expired: <span id="stat-expired" class="font-bold text-rose-500">0</span></div>
            </div>

            <div class="bg-slate-800 rounded-2xl overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="p-4">Name</th><th class="p-4">Phone</th><th class="p-4">IP</th><th class="p-4">Machine ID</th><th class="p-4">Key</th><th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
