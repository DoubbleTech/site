<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Web | Doubble Tech Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .view-hidden { display: none !important; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .status-pill { padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        
        /* Animation for the refresh icon */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-view" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-card p-10 rounded-[32px] w-full max-w-md shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center font-bold text-black mb-4">S</div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Admin Authentication</h2>
                <p class="text-slate-400 text-sm">Enter cloud credentials to manage users</p>
            </div>
            
            <input type="text" id="username" placeholder="Username" class="w-full mb-4 p-4 bg-slate-900/50 rounded-2xl border border-slate-700 focus:border-emerald-500 outline-none transition-all">
            <input type="password" id="password" placeholder="Access Token" class="w-full mb-6 p-4 bg-slate-900/50 rounded-2xl border border-slate-700 focus:border-emerald-500 outline-none transition-all">
            
            <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 rounded-2xl transition-all shadow-lg shadow-emerald-500/20">
                LOGIN TO CLOUD
            </button>
        </div>
    </div>

    <div id="dashboard-view" class="view-hidden p-8">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-12">
                <div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">Secure Web Console</h1>
                    <p class="text-slate-400 text-sm">Managing Doubble Tech Subscriptions</p>
                </div>
                <button onclick="location.reload()" class="bg-rose-500/10 text-rose-400 px-6 py-2 rounded-full font-bold text-xs border border-rose-500/20 hover:bg-rose-500 hover:text-white transition-all">
                    LOGOUT
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-2">Active Users</p>
                    <span id="stat-active" class="text-4xl font-bold text-emerald-400">0</span>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-2">Pending Approvals</p>
                    <span id="stat-pending" class="text-4xl font-bold text-amber-400">0</span>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-2">Total Revenue</p>
                    <span id="stat-revenue" class="text-4xl font-bold text-white">0</span> <small class="text-slate-500">PKR</small>
                </div>
                <div class="glass-card p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-2">System Status</p>
                    <span class="text-emerald-400 font-bold flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span> ONLINE
                    </span>
                </div>
            </div>

            <div class="flex justify-end mb-4">
                <button onclick="manualRefresh()" id="refreshBtn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 transition-all">
                    <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    SYNC CLOUD DATA
                </button>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-800/50 text-slate-400 text-[10px] font-bold uppercase tracking-widest border-b border-slate-700">
                            <tr>
                                <th class="p-6">User Phone</th>
                                <th class="p-6">Device/Status</th>
                                <th class="p-6">Last Seen</th>
                                <th class="p-6">Status</th>
                                <th class="p-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-800">
                            </tbody>
                    </table>
                </div>
                <div id="no-data" class="p-20 text-center text-slate-500">
                    Waiting for cloud connection...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSKtg7y1C3bLGyojiI-6hCdU-UOCYrMYY",
            authDomain: "web-doubbletech.firebaseapp.com",
            projectId: "web-doubbletech",
            storageBucket: "web-doubbletech.firebasestorage.app",
            messagingSenderId: "629547474346",
            appId: "1:629547474346:web:d788f9876601e8fc545fd3",
            measurementId: "G-3VEKHEH99Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let unsubscribe = null;

        // LOGIN HANDLER
        window.handleLogin = function() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'admin' && p === 'doubble2026') {
                document.getElementById('login-view').classList.add('view-hidden');
                document.getElementById('dashboard-view').classList.remove('view-hidden');
                startLiveSync();
            } else {
                alert('Access Denied: Incorrect Credentials');
            }
        };

        // MANUAL REFRESH FUNCTION
        window.manualRefresh = async function() {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            
            // Visual feedback
            btn.classList.add('opacity-50');
            icon.classList.add('spin');
            
            try {
                // Restart the live listener
                startLiveSync();
                console.log("Cloud Data Resynced");
            } finally {
                setTimeout(() => {
                    btn.classList.remove('opacity-50');
                    icon.classList.remove('spin');
                }, 800);
            }
        };

        // REAL-TIME SYNC ENGINE
        function startLiveSync() {
            if (unsubscribe) unsubscribe(); // Prevent duplicate listeners

            // PATH FIXED: Uses simple "users" collection to match Extension
            const usersRef = collection(db, "users");
            
            unsubscribe = onSnapshot(usersRef, (snapshot) => {
                const tbody = document.getElementById('tableBody');
                const noData = document.getElementById('no-data');
                
                tbody.innerHTML = '';
                let activeCount = 0;
                let pendingCount = 0;

                if (snapshot.empty) {
                    noData.classList.remove('view-hidden');
                } else {
                    noData.classList.add('view-hidden');
                    
                    snapshot.forEach((snap) => {
                        const user = snap.data();
                        const id = snap.id;
                        
                        if (user.status === 'Activated' || user.status === 'Active') activeCount++;
                        else pendingCount++;

                        const timestamp = user.timestamp ? new Date(user.timestamp).toLocaleString() : 'N/A';

                        const row = `
                            <tr class="hover:bg-slate-800/30 transition-colors">
                                <td class="p-6">
                                    <div class="font-bold text-white">${user.phone || 'Unknown'}</div>
                                    <div class="text-[10px] text-slate-500 uppercase tracking-tighter">UID: ${id}</div>
                                </td>
                                <td class="p-6">
                                    <div class="text-xs text-slate-300 font-mono">${user.platform || 'Web Portal'}</div>
                                </td>
                                <td class="p-6 text-xs text-slate-400">
                                    ${timestamp}
                                </td>
                                <td class="p-6">
                                    <span class="status-pill ${user.status === 'Activated' || user.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                                        ${user.status}
                                    </span>
                                </td>
                                <td class="p-6 text-right space-x-3">
                                    ${(user.status === 'Pending') ? 
                                        `<button onclick="updateStatus('${id}', 'Activated')" class="text-emerald-400 font-bold text-xs hover:underline">Approve</button>` : 
                                        `<button onclick="updateStatus('${id}', 'Pending')" class="text-amber-400 font-bold text-xs hover:underline">Revoke</button>`
                                    }
                                    <button onclick="removeUser('${id}')" class="text-rose-500/40 hover:text-rose-500 text-xs font-bold transition-all">Delete</button>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                }

                // Update Stats
                document.getElementById('stat-active').innerText = activeCount;
                document.getElementById('stat-pending').innerText = pendingCount;
                document.getElementById('stat-revenue').innerText = (activeCount * 299).toLocaleString();
            }, (error) => {
                console.error("Live Sync Error:", error);
                alert("Permission Denied: Check Firestore Rules");
            });
        }

        // DATABASE ACTIONS (Standardized Paths)
        window.updateStatus = async (id, newStatus) => {
            try {
                const ref = doc(db, "users", id);
                await updateDoc(ref, { status: newStatus });
            } catch (e) {
                alert("Error updating status: " + e.message);
            }
        };

        window.removeUser = async (id) => {
            if (confirm('Permanently remove this user from Doubble Tech database?')) {
                try {
                    const ref = doc(db, "users", id);
                    await deleteDoc(ref);
                } catch (e) {
                    alert("Error deleting user: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
